<!DOCTYPE html>
<html>
<head>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
async function runAI(text, type) {
  try {
    let prompt = '';

    if (type === 'summary') {
      prompt = `Please summarize the following text in a clear and concise way:\n\n${text}`;
    } else if (type === 'quiz') {
      prompt = `Based on the following text, generate 5 multiple choice questions as a JSON array.
Each object must have: "question" (string), "options" (array of 4 strings), "answer" (string matching one of the options exactly).
Return ONLY the JSON array, no extra text.\n\n${text}`;
    } else if (type === 'chat') {
      prompt = text;
    }

    const response = await puter.ai.chat(prompt, {
      model: 'x-ai/grok-4-1-fast'
    });

    const result = typeof response === 'string'
      ? response
      : response?.message?.content ?? response?.content ?? JSON.stringify(response);

    window.flutter_inappwebview.callHandler('onResult', JSON.stringify({
      success: true,
      result: result
    }));

  } catch (e) {
    window.flutter_inappwebview.callHandler('onResult', JSON.stringify({
      success: false,
      error: e.toString()
    }));
  }
}
</script>
</body>
</html>
